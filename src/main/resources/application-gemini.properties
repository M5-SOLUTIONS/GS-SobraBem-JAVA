# Só é lido com o profile gemini ativo (SPRING_PROFILES_ACTIVE=gemini).
sobrabem.ia.modo=gemini

# Busca no corpus: quantos trechos e a similaridade mínima (calibre com o avaliar.py)
sobrabem.ia.top-k=2
sobrabem.ia.similaridade-minima=0.6

# Liga os dois clientes que o application.properties deixa desligados
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
# Religa a conexão de embeddings que o application.properties exclui
spring.autoconfigure.exclude=

# Chave do Google AI Studio (vem do .env ou do host)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Modelos. Cada propriedade aparece duas vezes: sem "options" (nome do Spring AI 2.0)
# e com "options" (nome da 1.x). A que não existir na versão instalada é ignorada.
# O text-embedding-004 foi desligado pelo Google: o modelo de embeddings precisa ser explícito.
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.options.temperature=0.2
# O Gemini 3 "pensa" antes de responder (nível HIGH por padrão), e isso estoura os 20 s.
# Para 3 frases baseadas em trechos prontos, LOW basta.
spring.ai.google.genai.chat.thinking-level=LOW
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# Falha rápida: o IaService corta em 20 s, então não adianta o Spring AI insistir por minutos
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

# Mostra no console quais trechos a busca achou (útil para calibrar a similaridade)
logging.level.br.com.sobrabem.ai=DEBUG