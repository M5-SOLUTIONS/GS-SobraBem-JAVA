spring.application.name=sobrabem

# Em desenvolvimento, lê o .env da raiz do projeto. No deploy, variáveis de ambiente de verdade.
spring.config.import=optional:file:.env[.properties]

# ---------- Oracle ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Instant vira TIMESTAMP comum, em UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=sb_flyway_schema_history

# ---------- JWT ----------
sobrabem.jwt.secret=${JWT_SECRET}
sobrabem.jwt.validade=2h

# ---------- ADMIN inicial ----------
sobrabem.admin.email=${ADMIN_EMAIL:}
sobrabem.admin.senha=${ADMIN_SENHA:}

# ---------- RabbitMQ ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:sobrabem}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:sobrabem}
# no CloudAMQP (deploy) o vhost é igual ao usuário
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s
# consumidor: 1 tentativa + 2 retries = 3; depois a mensagem é rejeitada e descartada
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2

# ---------- E-mail (Gmail) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
# senha de app de 16 caracteres, não a senha da conta
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
sobrabem.mail.remetente=${MAIL_USERNAME:}
# false: o consumidor só registra o e-mail no log (desenvolvimento, Postman); true: envia pelo Gmail
sobrabem.mail.envio-habilitado=${MAIL_ENVIO_HABILITADO:false}

# ---------- IA ----------
# fake: resposta fixa (padrão); gemini: implementação real com Spring AI
sobrabem.ia.modo=${IA_MODO:fake}
sobrabem.ia.timeout=20s

# ---------- Paginação ----------
spring.data.web.pageable.max-page-size=50