spring.application.name=sobrabem

# Em desenvolvimento, lê o .env da raiz do projeto. No deploy, variáveis de ambiente de verdade.
spring.config.import=optional:file:.env[.properties]

# ---------- Oracle ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Instant vira TIMESTAMP comum, em UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=sb_flyway_schema_history

# ---------- JWT ----------
sobrabem.jwt.secret=${JWT_SECRET}
sobrabem.jwt.validade=2h

# ---------- ADMIN inicial ----------
sobrabem.admin.email=${ADMIN_EMAIL:}
sobrabem.admin.senha=${ADMIN_SENHA:}

# ---------- Paginação ----------
spring.data.web.pageable.max-page-size=50